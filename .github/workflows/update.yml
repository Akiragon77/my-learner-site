name: Update Coursera AI Top 5

on:
  schedule:
    # 毎日 日本時間午前9時 (UTC 0:00) に自動実行
    - cron: '0 0 * * *'
  workflow_dispatch: # GitHubの管理画面から手動実行も可能にする

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run script
      run: python fetch_coursera.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add ai_top5_courses.json README.md
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update: Top 5 Coursera AI Courses" && git push)