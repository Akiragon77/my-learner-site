<!-- Coursera Section -->
<section class="section">
  <h2>Top-Rated Coursera Courses</h2>

  <div id="coursera-course-list">
    <p>Loading top courses...</p>
  </div>
</section>

<script>
  fetch('./ai_top5_courses.json?v=' + new Date().getTime())
    .then(response => {
      if (!response.ok) throw new Error('Failed to load JSON');
      return response.json();
    })
    .then(courses => {
      const container = document.getElementById('coursera-course-list');
      
      if (!courses || courses.length === 0) {
        container.innerHTML = '<p>No course data available.</p>';
        return;
      }

      let html = '';

      courses.forEach((course, index) => {
        const rank = index + 1;
        
        // workload（講義時間）が存在する場合のみHTML要素を生成
        const metaWorkload = course.workload 
          ? `<span class="meta-item">⏱ ${course.workload}</span>` 
          : '';

        html += `
          <div class="course-card">
            <div class="course-header">
              <span class="rank-badge" style="background-color: #0056b3;">#${rank}</span>
              <h3 class="title">${course.name}</h3>
            </div>
            <div class="meta-container" style="margin: 10px 0; display: flex; gap: 15px; font-size: 0.9rem; color: #555; align-items: center;">
              ${metaWorkload}
              <span class="meta-item">🏛 Coursera</span>
            </div>
            <div class="btn-container">
              <a href="${course.url}" class="btn-detail" target="_blank" rel="noopener noreferrer">View Details →</a>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    })
    .catch(error => {
      console.error('Error loading course data:', error);
      document.getElementById('coursera-course-list').innerHTML = '<p>Unable to load top courses at this time.</p>';
    });
</script>
